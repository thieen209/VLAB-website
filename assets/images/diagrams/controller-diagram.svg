<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%" fill="none">
  <!-- Blueprint Background Grid -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="0.75"/>
    </pattern>
    <linearGradient id="grad-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10285C" flood-opacity="0.08"/>
    </filter>
  </defs>
  
  <rect width="700" height="450" fill="url(#grid)"/>

  <!-- Controller Outer Ergonomic Shell (Ergonomic Grip Handheld) -->
  <g filter="url(#shadow)">
    <!-- Main Handle & Grip Body -->
    <path d="M 270,90 
             C 330,85 380,105 410,150 
             C 435,190 440,240 430,290 
             C 420,340 395,385 365,400 
             C 335,415 295,405 275,370 
             C 255,335 250,280 250,230 
             C 250,170 240,110 270,90 Z" 
          fill="url(#grad-body)" stroke="#10285C" stroke-width="3"/>

    <!-- Grip Texture Lines -->
    <line x1="275" y1="280" x2="310" y2="295" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <line x1="280" y1="305" x2="315" y2="320" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <line x1="285" y1="330" x2="320" y2="345" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Component 1: Analog Joystick (Top thumb zone) -->
  <g class="hw-pin-highlight" data-pin="joystick">
    <circle cx="340" cy="150" r="34" fill="#E2E8F0" stroke="#10285C" stroke-width="2.5"/>
    <circle cx="340" cy="150" r="22" fill="#2155D9" stroke="#1E40AF" stroke-width="2"/>
    <circle cx="335" cy="145" r="8" fill="#60A5FA"/>
    <!-- Directional Indicators -->
    <path d="M 340,122 L 340,128 M 340,172 L 340,178 M 312,150 L 318,150 M 362,150 L 368,150" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Component 2: Action Buttons (Upper right) -->
  <g class="hw-pin-highlight" data-pin="buttons">
    <circle cx="390" cy="195" r="14" fill="#087F8C" stroke="#10285C" stroke-width="2"/>
    <text x="390" y="200" fill="#FFFFFF" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">A</text>

    <circle cx="365" cy="230" r="14" fill="#087F8C" stroke="#10285C" stroke-width="2"/>
    <text x="365" y="235" fill="#FFFFFF" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">B</text>
  </g>

  <!-- Component 3: Internal IMU Sensor Board (Middle Housing) -->
  <g class="hw-pin-highlight" data-pin="imu">
    <rect x="290" y="230" width="45" height="35" rx="4" fill="#0F766E" stroke="#10285C" stroke-width="2"/>
    <circle cx="305" cy="245" r="3" fill="#34D399"/>
    <text x="312" y="252" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold">IMU</text>
    <path d="M 295,240 L 295,255 M 330,240 L 330,255" stroke="#FDE047" stroke-width="1.5"/>
  </g>

  <!-- Component 4: ESP32 Microcontroller Core (Lower handle compartment) -->
  <g class="hw-pin-highlight" data-pin="esp32">
    <rect x="300" y="285" width="55" height="75" rx="6" fill="#1E293B" stroke="#10285C" stroke-width="2"/>
    <!-- Metal RF Shield -->
    <rect x="308" y="300" width="38" height="35" rx="3" fill="#94A3B8" stroke="#64748B" stroke-width="1.5"/>
    <text x="327" y="322" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" text-anchor="middle">ESP32</text>
    <!-- PCB Gold Pins -->
    <line x1="300" y1="365" x2="300" y2="355" stroke="#F59E0B" stroke-width="2"/>
    <line x1="308" y1="365" x2="308" y2="355" stroke="#F59E0B" stroke-width="2"/>
    <line x1="316" y1="365" x2="316" y2="355" stroke="#F59E0B" stroke-width="2"/>
    <line x1="324" y1="365" x2="324" y2="355" stroke="#F59E0B" stroke-width="2"/>
    <line x1="332" y1="365" x2="332" y2="355" stroke="#F59E0B" stroke-width="2"/>
    <line x1="340" y1="365" x2="340" y2="355" stroke="#F59E0B" stroke-width="2"/>
    <line x1="348" y1="365" x2="348" y2="355" stroke="#F59E0B" stroke-width="2"/>
  </g>

  <!-- Technical Callout Leader Lines & Labels -->
  <!-- Callout 1: Joystick -->
  <path d="M 340,116 L 340,55 L 180,55" stroke="#2155D9" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="180" cy="55" r="4" fill="#2155D9"/>
  <rect x="30" y="38" width="140" height="34" rx="4" fill="#FFFFFF" stroke="#2155D9" stroke-width="1.5"/>
  <text x="42" y="54" fill="#10285C" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="bold">Analog Joystick</text>
  <text x="42" y="66" fill="#64748B" font-family="'Be Vietnam Pro', sans-serif" font-size="9">Điều hướng 3D</text>

  <!-- Callout 2: Buttons -->
  <path d="M 405,195 L 520,195" stroke="#087F8C" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="520" cy="195" r="4" fill="#087F8C"/>
  <rect x="530" y="178" width="140" height="34" rx="4" fill="#FFFFFF" stroke="#087F8C" stroke-width="1.5"/>
  <text x="542" y="194" fill="#10285C" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="bold">Action Buttons</text>
  <text x="542" y="206" fill="#64748B" font-family="'Be Vietnam Pro', sans-serif" font-size="9">Thao tác gắp / bấm</text>

  <!-- Callout 3: IMU -->
  <path d="M 290,245 L 180,245" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="180" cy="245" r="4" fill="#0F766E"/>
  <rect x="30" y="228" width="140" height="34" rx="4" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
  <text x="42" y="244" fill="#10285C" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="bold">Cảm biến IMU</text>
  <text x="42" y="256" fill="#64748B" font-family="'Be Vietnam Pro', sans-serif" font-size="9">Thu thập góc quay</text>

  <!-- Callout 4: ESP32 -->
  <path d="M 355,325 L 520,325" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="520" cy="325" r="4" fill="#1E293B"/>
  <rect x="530" y="308" width="140" height="34" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5"/>
  <text x="542" y="324" fill="#10285C" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="bold">Vi điều khiển ESP32</text>
  <text x="542" y="336" fill="#64748B" font-family="'Be Vietnam Pro', sans-serif" font-size="9">Xử lý & truyền BLE</text>

  <!-- Bottom Blueprint Stamp -->
  <rect x="235" y="415" width="230" height="22" rx="4" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
  <text x="350" y="430" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">SƠ ĐỒ CẤU HÌNH THIẾT KẾ — CHỜ XÁC NHẬN</text>
</svg>
